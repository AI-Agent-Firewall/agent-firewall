[package]
name = "agent-firewall-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ctrlc = "3"
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.1"

[dev-dependencies]
tempfile = "3"
